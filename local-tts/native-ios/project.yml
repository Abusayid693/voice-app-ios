name: KokoroAneTest
options:
  deploymentTarget:
    iOS: "17.0"
  bundleIdPrefix: com.rehanchoudhury.kokoroanetest
packages:
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio
    exactVersion: 0.15.6
targets:
  KokoroAneTest:
    type: application
    platform: iOS
    sources:
      - path: Sources
      # Locally-converted (laishere/kokoro-coreml) Kokoro-ANE models, staged
      # for a one-off custom-voice test — see DependencyContainer.swift.
      # `type: folder` forces Xcode to copy this as a single folder
      # reference (atomic directory copy), not process/flatten it the way
      # the default source-scanning would with the individual files inside
      # each already-compiled .mlmodelc bundle.
      - path: CustomKokoroModel
        type: folder
        buildPhase: resources
    dependencies:
      - package: FluidAudio
        product: FluidAudio
    info:
      path: Sources/Resources/Info.plist
      properties:
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rehanchoudhury.kokoroanetest
        SWIFT_VERSION: 5.0
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: Q2F3H94YUP
