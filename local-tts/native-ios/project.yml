name: KokoroAneTest
options:
  deploymentTarget:
    iOS: "17.0"
  bundleIdPrefix: com.rehanchoudhury.kokoroanetest
packages:
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio
    exactVersion: 0.15.6
targets:
  KokoroAneTest:
    type: application
    platform: iOS
    sources: [Sources]
    dependencies:
      - package: FluidAudio
        product: FluidAudio
    info:
      path: Sources/Resources/Info.plist
      properties:
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rehanchoudhury.kokoroanetest
        SWIFT_VERSION: 5.0
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: Q2F3H94YUP
