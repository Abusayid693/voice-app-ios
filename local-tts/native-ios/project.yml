name: KokoroAneTest
options:
  deploymentTarget:
    iOS: "18.0"
  bundleIdPrefix: com.rehanchoudhury.kokoroanetest
packages:
  # Pinned past the latest tagged release (v0.15.7, 2026-09-10) to a
  # specific main commit — FluidInference/FluidAudio#915 (merged
  # 2026-09-13), the fix that gives KokoroAneVariant.japanese a real text
  # frontend, isn't in any tagged release yet. Also picks up #918 (a real
  # ModelHub download-verification bug fix, unrelated to Kokoro), the new
  # Chatterbox backends (unused by this app), and #944 (KokoroAneSynthesisResult
  # .normalizedText — the fix for #943, an issue this app filed; see
  # ChapterSynthesisService.deriveWordTimings). Revisit once a release
  # ships that includes 5343241 and switch back to exactVersion.
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio
    revision: 5343241cd8a7576890e50925dec666bafc89d324
  # Smoother, rounded icon set replacing SF Symbols in the app's own UI
  # chrome (not a system-level override — SF Symbols are still used
  # wherever a truly native/system look is expected). ISC-licensed,
  # zero runtime dependencies, real SwiftUI vector Shapes (not bundled
  # raster images).
  LucideSwift:
    url: https://github.com/ajaxjiang96/lucide-swift
    exactVersion: 0.9.4
  # Replacing LucideSwift in some call sites (ImportHomeView and the
  # archived Explore menu) — both packages are
  # present since the migration isn't complete across every icon call
  # site yet. No tagged release as of this pin; revision is
  # hugeicons-swift's own main at the time this was added.
  Hugeicons:
    url: https://github.com/iSapozhnik/hugeicons-swift
    revision: 81caddf04ce5352652ffaa619562f02477dbf35d
targets:
  KokoroAneTest:
    type: application
    platform: iOS
    sources:
      - path: Sources
        # Vendored libraries each keep their own README/LICENSE for
        # attribution (see Sources/Vendor/*'s own doc comments) — excluded
        # here because the whole-folder scan otherwise bundles them as
        # resources, and two vendored folders both naming theirs README.md
        # collide at the app bundle's flattened root ("Multiple commands
        # produce .../README.md"), the first time a second vendored library
        # was added after ThinkingOrbsKit. Docs, not resources, so excluding
        # them changes nothing the app actually uses.
        excludes:
          - "**/README.md"
          - "**/LICENSE"
          - "**/LICENSE.md"
      # Locally-converted (laishere/kokoro-coreml) Kokoro-ANE models, staged
      # for a one-off custom-voice test — see DependencyContainer.swift.
      # `type: folder` forces Xcode to copy this as a single folder
      # reference (atomic directory copy), not process/flatten it the way
      # the default source-scanning would with the individual files inside
      # each already-compiled .mlmodelc bundle.
      - path: CustomKokoroModel
        type: folder
        buildPhase: resources
      # Bundled voice-preview clips (Sources/Features/TTS) — bundled
      # rather than synthesized on demand so a preview plays instantly with
      # no engine warm-up. Same reasoning as CustomKokoroModel above: added
      # under the plain `Sources` scan, this would be flattened (losing the
      # per-engine subdirectory VoicePreviewPlayer.clipURL looks up via
      # Bundle.main.url(forResource:withExtension:subdirectory:)) —
      # `type: folder` preserves the real directory structure instead.
      - path: VoicePreviews
        type: folder
        buildPhase: resources
      # Decorative 200pt My Shelf header artwork. Kept as a standalone PNG
      # resource so the shelf can load it by the stable `halftone` name.
      # `assets/` is otherwise a source-of-truth export folder that is NOT
      # bundled, so an image dropped there renders nothing until it is listed
      # here as well.
      - path: assets/theme/halftone.png
        buildPhase: resources
      # hexgrad/Kokoro-82M's 8 officially-named, officially-graded Mandarin
      # voice tensors (zf_xiaobei/zf_xiaoni/zf_xiaoxiao/zf_xiaoyi,
      # zm_yunjian/zm_yunxi/zm_yunxia/zm_yunyang), converted to the same
      # [510,256] fp32 .bin format CustomKokoroModel's English voices use —
      # see model-conversion/kokoro-mandarin-voices/. Chosen over FluidAudio's
      # own ANE-zh/voices/ numbered set (zf_001.../zm_009...) because that
      # set's speaker provenance is undocumented. `type: folder` keeps this
      # a flat, unflattened folder reference like the others above.
      - path: BundledMandarinVoices
        type: folder
        buildPhase: resources
    dependencies:
      - package: FluidAudio
        product: FluidAudio
      - package: LucideSwift
        product: LucideSwift
      - package: Hugeicons
        product: Hugeicons
    info:
      path: Sources/Resources/Info.plist
      properties:
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # Lets Kokoro playback keep running (and the process stay
        # unsuspended) once the screen locks or the app backgrounds — see
        # ChapterAudioPlayer.swift, the reader's playback owner.
        UIBackgroundModes: [audio, processing]
        # Imports are checkpointed page-by-page and resumed by this
        # opportunistic iOS background processing task.
        BGTaskSchedulerPermittedIdentifiers:
          - com.rehanchoudhury.kokoroanetest.pdf-import
        # `xcodegen generate` regenerates Info.plist from these properties
        # every time — editing the plist file directly gets clobbered on the
        # next generate. Settings > About reads this back via
        # Bundle.main.infoDictionary.
        CFBundleShortVersionString: "0.1.0"
        # Bundled reading-surface fonts: EB Garamond styles the Shelf title,
        # while Inter styles book names in the expanded detail card.
        UIAppFonts:
          - EBGaramond-Italic.ttf
          - EBGaramond-Regular.ttf
          - Inter-Variable.ttf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rehanchoudhury.kokoroanetest
        SWIFT_VERSION: 5.0
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: Q2F3H94YUP
        # No custom app icon exists — without this, xcodegen's default
        # ASSETCATALOG_COMPILER_APPICON_NAME (AppIcon) was a silent no-op
        # while Sources/Resources/Assets.xcassets didn't exist, but now
        # that a real catalog exists (voice covers) the asset compiler
        # runs and warns it can't find an "AppIcon" set inside it.
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
