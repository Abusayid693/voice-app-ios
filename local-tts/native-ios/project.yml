name: KokoroAneTest
options:
  deploymentTarget:
    iOS: "17.0"
  bundleIdPrefix: com.rehanchoudhury.kokoroanetest
packages:
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio
    exactVersion: 0.15.6
  # Smoother, rounded icon set replacing SF Symbols in the app's own UI
  # chrome (not a system-level override — SF Symbols are still used
  # wherever a truly native/system look is expected). ISC-licensed,
  # zero runtime dependencies, real SwiftUI vector Shapes (not bundled
  # raster images) — see ENG_CONTEXT.md for the alternatives considered.
  LucideSwift:
    url: https://github.com/ajaxjiang96/lucide-swift
    exactVersion: 0.9.4
targets:
  KokoroAneTest:
    type: application
    platform: iOS
    sources:
      - path: Sources
      # Locally-converted (laishere/kokoro-coreml) Kokoro-ANE models, staged
      # for a one-off custom-voice test — see DependencyContainer.swift.
      # `type: folder` forces Xcode to copy this as a single folder
      # reference (atomic directory copy), not process/flatten it the way
      # the default source-scanning would with the individual files inside
      # each already-compiled .mlmodelc bundle.
      - path: CustomKokoroModel
        type: folder
        buildPhase: resources
      # Bundled voice-preview clips (Sources/Features/Import — see
      # ENG_CONTEXT.md's "Voice previews" section). Same reasoning as
      # CustomKokoroModel above: added under the plain `Sources` scan, this
      # would be flattened (losing the Kokoro/Pocket subdirectories that
      # TTSViewModel.togglePreview looks up via
      # Bundle.main.url(forResource:withExtension:subdirectory:)) —
      # `type: folder` preserves the real directory structure instead.
      - path: VoicePreviews
        type: folder
        buildPhase: resources
    dependencies:
      - package: FluidAudio
        product: FluidAudio
      - package: LucideSwift
        product: LucideSwift
    info:
      path: Sources/Resources/Info.plist
      properties:
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # Voice cloning (Features/VoiceClone) records a short in-app sample
        # via AVAudioRecorder — required or the app crashes on first mic use.
        NSMicrophoneUsageDescription: Used to record a short sample of your voice to create a cloned voice.
        # `xcodegen generate` regenerates Info.plist from these properties
        # every time — editing the plist file directly gets clobbered on the
        # next generate. Settings > About reads this back via
        # Bundle.main.infoDictionary.
        CFBundleShortVersionString: "0.1.0"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rehanchoudhury.kokoroanetest
        SWIFT_VERSION: 5.0
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: Q2F3H94YUP
        # No custom app icon exists — without this, xcodegen's default
        # ASSETCATALOG_COMPILER_APPICON_NAME (AppIcon) was a silent no-op
        # while Sources/Resources/Assets.xcassets didn't exist, but now
        # that a real catalog exists (voice covers) the asset compiler
        # runs and warns it can't find an "AppIcon" set inside it.
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
